name: Binary Ninja API tags

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binaryninja-api-tags
  cancel-in-progress: false

jobs:
  discover:
    name: Discover release tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      count: ${{ steps.tags.outputs.count }}
      releases: ${{ steps.tags.outputs.releases }}
    steps:
      - name: Check out monitor source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out development state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: channels/dev
          ref: dev

      - name: Test tag selection
        run: python3 .github/scripts/CheckBinaryNinjaTagsTests.py

      - name: Check upstream tags
        id: tags
        run: >-
          python3 .github/scripts/CheckBinaryNinjaTags.py
          --dev-state channels/dev/.github/binaryninja-api-tags/dev.txt
          --remote "https://github.com/${GITHUB_REPOSITORY}.git"
          --published-formula-base-url
          "https://raw.githubusercontent.com/0cyn/homebrew-tap/main/Formula"

  propose:
    name: Propose ${{ matrix.release.tag }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.discover.outputs.releases) }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ matrix.release.base }}
          submodules: recursive

      - name: Update the API revision
        id: update
        env:
          BRANCH: ${{ matrix.release.branch }}
          BASE: ${{ matrix.release.base }}
          CHANNEL: ${{ matrix.release.channel }}
          SHA: ${{ matrix.release.sha }}
          TAG: ${{ matrix.release.tag }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1
          then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch -c "$BRANCH"
          git -C vendor/binaryninja-api fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          resolved="$(git -C vendor/binaryninja-api rev-list -n 1 "$TAG")"
          test "$resolved" = "$SHA"
          git -C vendor/binaryninja-api checkout --detach "$SHA"
          git -C vendor/binaryninja-api submodule update --init --recursive
          printf '%s %s\n' "$TAG" "$SHA" > ".github/binaryninja-api-tags/$CHANNEL.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/binaryninja-api ".github/binaryninja-api-tags/$CHANNEL.txt"
          git commit -m "binaryninja-api: $TAG"
          git push --set-upstream origin "$BRANCH"
          {
            echo "created=true"
            echo "head_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.update.outputs.created == 'true'
        env:
          BRANCH: ${{ matrix.release.branch }}
          BASE: ${{ matrix.release.base }}
          CHANNEL: ${{ matrix.release.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ matrix.release.sha }}
          TAG: ${{ matrix.release.tag }}
        run: |
          body="$(printf '%s\n' \
            'Automated Binary Ninja API tag update.' \
            '' \
            "- Channel: \`$CHANNEL\`" \
            "- Base branch: \`$BASE\`" \
            "- Tag: \`$TAG\`" \
            "- API commit: \`$SHA\`" \
            '' \
             'The hourly monitor verified the official tag and updated the pinned submodule.' \
             'The dispatched build workflow validates macOS and Linux against generated link stubs.' \
             'A trusted workflow will rebase-merge this pull request after both builds pass.' \
             'The later tap workflow publishes all three bottles automatically.')"
          url="$(gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "binaryninja-api: $TAG" \
            --body "$body")"
          printf 'Created %s\n' "$url"
          printf '### %s\n\n%s\n' "$TAG" "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch and wait for compatibility build
        if: steps.update.outputs.created == 'true'
        id: build
        env:
          BRANCH: ${{ matrix.release.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.update.outputs.head_sha }}
        run: |
          previous_run_id="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f event=workflow_dispatch -f branch="$BRANCH" -f per_page=20 \
            --jq '.workflow_runs[0].id // 0')"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

          run_id=""
          for _ in {1..60}
          do
            runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f event=workflow_dispatch -f branch="$BRANCH" -f per_page=20)"
            run_id="$(jq -r --arg sha "$HEAD_SHA" --argjson previous "$previous_run_id" \
              '[.workflow_runs[] | select(.head_sha == $sha and .id > $previous)] | max_by(.id).id // empty' \
              <<<"$runs")"
            if [[ -n "$run_id" ]]
            then
              break
            fi
            sleep 2
          done
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]

          for _ in {1..400}
          do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            status="$(jq -r '.status' <<<"$run")"
            if [[ "$status" = completed ]]
            then
              test "$(jq -r '.conclusion' <<<"$run")" = success
              test "$(jq -r '.head_branch' <<<"$run")" = "$BRANCH"
              test "$(jq -r '.head_sha' <<<"$run")" = "$HEAD_SHA"
              jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
              test "$(jq '[.jobs[] | select(.name == "Linux" and .conclusion == "success")] | length' <<<"$jobs")" = 1
              test "$(jq '[.jobs[] | select(.name == "macOS" and .conclusion == "success")] | length' <<<"$jobs")" = 1
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              printf 'Validated build run: [%s](https://github.com/%s/actions/runs/%s)\n' \
                "$run_id" "$GITHUB_REPOSITORY" "$run_id" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "Compatibility build $run_id did not complete before the promotion deadline." >&2
          exit 1

      - name: Dispatch source promotion
        if: steps.update.outputs.created == 'true'
        env:
          BRANCH: ${{ matrix.release.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.update.outputs.head_sha }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
        run: >-
          gh workflow run promote-dev-source.yml --repo "$GITHUB_REPOSITORY" --ref stable
          -f run_id="$RUN_ID" -f head_branch="$BRANCH" -f head_sha="$HEAD_SHA"
