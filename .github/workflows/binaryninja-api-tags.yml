name: Binary Ninja API tags

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binaryninja-api-tags
  cancel-in-progress: false

jobs:
  discover:
    name: Discover release tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      count: ${{ steps.tags.outputs.count }}
      releases: ${{ steps.tags.outputs.releases }}
    steps:
      - name: Check out monitor source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out development state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: channels/dev
          ref: dev

      - name: Test tag selection
        run: python3 .github/scripts/CheckBinaryNinjaTagsTests.py

      - name: Check upstream tags
        id: tags
        run: >-
          python3 .github/scripts/CheckBinaryNinjaTags.py
          --dev-state channels/dev/.github/binaryninja-api-tags/dev.txt
          --remote "https://github.com/${GITHUB_REPOSITORY}.git"
          --published-formula-base-url
          "https://raw.githubusercontent.com/0cyn/homebrew-tap/main/Formula"

  propose:
    name: Propose ${{ matrix.release.tag }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.discover.outputs.releases) }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ matrix.release.base }}
          submodules: recursive

      - name: Update the API revision
        id: update
        env:
          BRANCH: ${{ matrix.release.branch }}
          BASE: ${{ matrix.release.base }}
          CHANNEL: ${{ matrix.release.channel }}
          SHA: ${{ matrix.release.sha }}
          TAG: ${{ matrix.release.tag }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1
          then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch -c "$BRANCH"
          git -C vendor/binaryninja-api fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          resolved="$(git -C vendor/binaryninja-api rev-list -n 1 "$TAG")"
          test "$resolved" = "$SHA"
          git -C vendor/binaryninja-api checkout --detach "$SHA"
          git -C vendor/binaryninja-api submodule update --init --recursive
          printf '%s %s\n' "$TAG" "$SHA" > ".github/binaryninja-api-tags/$CHANNEL.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/binaryninja-api ".github/binaryninja-api-tags/$CHANNEL.txt"
          git commit -m "binaryninja-api: $TAG"
          git push --set-upstream origin "$BRANCH"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.update.outputs.created == 'true'
        env:
          BRANCH: ${{ matrix.release.branch }}
          BASE: ${{ matrix.release.base }}
          CHANNEL: ${{ matrix.release.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ matrix.release.sha }}
          TAG: ${{ matrix.release.tag }}
        run: |
          body="$(printf '%s\n' \
            'Automated Binary Ninja API tag update.' \
            '' \
            "- Channel: \`$CHANNEL\`" \
            "- Base branch: \`$BASE\`" \
            "- Tag: \`$TAG\`" \
            "- API commit: \`$SHA\`" \
            '' \
             'The hourly monitor verified the official tag and updated the pinned submodule.' \
             'The dispatched build workflow validates macOS and Linux against generated link stubs.' \
             'A trusted workflow will rebase-merge this pull request after both builds pass.' \
             'The later tap workflow publishes all three bottles automatically.')"
          url="$(gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "binaryninja-api: $TAG" \
            --body "$body")"
          printf 'Created %s\n' "$url"
          printf '### %s\n\n%s\n' "$TAG" "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch compatibility build
        if: steps.update.outputs.created == 'true'
        env:
          BRANCH: ${{ matrix.release.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "$BRANCH"
