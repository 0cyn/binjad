name: Promote development source

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact successful build workflow run ID
        required: true
      head_branch:
        description: Exact tested automation branch
        required: true
      head_sha:
        description: Exact tested source commit
        required: true

permissions: {}

concurrency:
  group: promote-development-source
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_HEAD_BRANCH: ${{ inputs.head_branch }}
      RUN_HEAD_SHA: ${{ inputs.head_sha }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Validate the tested source update
        id: validation
        run: |
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_HEAD_BRANCH" =~ ^automation/binaryninja-api-dev-([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          branch_version="${BASH_REMATCH[1]}"

          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          test "$(jq -r '.event' <<<"$run")" = workflow_dispatch
          test "$(jq -r '.status' <<<"$run")" = completed
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$(jq -r '.head_branch' <<<"$run")" = "$RUN_HEAD_BRANCH"
          test "$(jq -r '.head_sha' <<<"$run")" = "$RUN_HEAD_SHA"
          test "$(jq -r '.head_repository.full_name' <<<"$run")" = "$GITHUB_REPOSITORY"

          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          test "$(jq '[.jobs[] | select(.name == "Linux" and .conclusion == "success")] | length' <<<"$jobs")" = 1
          test "$(jq '[.jobs[] | select(.name == "macOS" and .conclusion == "success")] | length' <<<"$jobs")" = 1

          owner="${GITHUB_REPOSITORY%%/*}"
          pulls="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=dev&head=$owner:$RUN_HEAD_BRANCH")"
          test "$(jq 'length' <<<"$pulls")" = 1
          pull_request="$(jq -r '.[0].number' <<<"$pulls")"
          pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pull_request")"
          test "$(jq -r '.user.login' <<<"$pull")" = "github-actions[bot]"
          test "$(jq -r '.base.ref' <<<"$pull")" = dev
          test "$(jq -r '.head.ref' <<<"$pull")" = "$RUN_HEAD_BRANCH"
          test "$(jq -r '.head.sha' <<<"$pull")" = "$RUN_HEAD_SHA"
          test "$(jq -r '.head.repo.full_name' <<<"$pull")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.commits' <<<"$pull")" = 1

          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pull_request/files?per_page=100")"
          test "$(jq '[.[] | select(.filename == ".github/binaryninja-api-tags/dev.txt")] | length' <<<"$files")" = 1
          test "$(jq '[.[] | select(.filename != ".github/binaryninja-api-tags/dev.txt" and .filename != "vendor/binaryninja-api")] | length' <<<"$files")" = 0

          state="$(gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/.github/binaryninja-api-tags/dev.txt?ref=$RUN_HEAD_SHA")"
          read -r tag api_revision extra <<<"$state"
          test -z "${extra:-}"
          test "$tag" = "dev/$branch_version"
          [[ "$api_revision" =~ ^[0-9a-f]{40}$ ]]

          tree="$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$RUN_HEAD_SHA?recursive=1")"
          gitlink="$(jq -r '.tree[] | select(.path == "vendor/binaryninja-api" and .type == "commit") | .sha' <<<"$tree")"
          test "$gitlink" = "$api_revision"

          refs="$(git ls-remote --tags https://github.com/Vector35/binaryninja-api.git \
            "refs/tags/$tag" "refs/tags/$tag^{}")"
          resolved=""
          while read -r commit reference
          do
            if [[ -z "$resolved" || "$reference" = "refs/tags/$tag^{}" ]]
            then
              resolved="$commit"
            fi
          done <<<"$refs"
          test "$resolved" = "$api_revision"

          base_sha="$(jq -r '.base.sha' <<<"$pull")"
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$base_sha...$RUN_HEAD_SHA")"
          test "$(jq -r '.behind_by' <<<"$comparison")" = 0

          {
            echo "pull_request=$pull_request"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Rebase-merge the source update
        env:
          PULL_REQUEST: ${{ steps.validation.outputs.pull_request }}
        run: gh pr merge "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --rebase --delete-branch

      - name: Dispatch formula proposal for the merged source
        env:
          PULL_REQUEST: ${{ steps.validation.outputs.pull_request }}
        run: |
          for _ in {1..30}
          do
            pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST")"
            merged="$(jq -r '.merged' <<<"$pull")"
            source_revision="$(jq -r '.merge_commit_sha' <<<"$pull")"
            dev_revision="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq '.object.sha')"
            if [[ "$merged" = true && "$source_revision" = "$dev_revision" && "$source_revision" =~ ^[0-9a-f]{40}$ ]]
            then
              tested_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$RUN_HEAD_SHA" --jq '.tree.sha')"
              merged_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$source_revision" --jq '.tree.sha')"
              test "$tested_tree" = "$merged_tree"
              gh workflow run dev-formula.yml --repo "$GITHUB_REPOSITORY" --ref stable \
                -f source_revision="$source_revision"
              printf "Merged source revision: \`%s\`\n" "$source_revision" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "The rebase merge did not become the dev branch head." >&2
          exit 1
